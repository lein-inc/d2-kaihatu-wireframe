<!DOCTYPE html>
<html class="staticrypt-html" lang="ja">
    <head>
        <meta charset="utf-8" />
        <title>/*[|template_title|]*/0</title>
        <meta name="viewport" content="width=device-width, initial-scale=1" />

        <meta http-equiv="cache-control" content="max-age=0" />
        <meta http-equiv="cache-control" content="no-cache" />
        <meta http-equiv="expires" content="0" />
        <meta http-equiv="pragma" content="no-cache" />

        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Inter:wght@400;500;700&display=swap" rel="stylesheet">

        <style>
            :root {
                --brand-primary: #015B9E;
                --brand-primary-dark: #013D6A;
                --brand-primary-pale: #E4EFF7;
                --brand-accent: #57B0A2;
                --brand-yellow: #FFD54F;
                --text-primary: #1A1A1A;
                --text-secondary: #555;
                --text-muted: #888;
                --border: #DCDCDC;
                --bg-subtle: #F5F5F5;
            }
            * { box-sizing: border-box; margin: 0; padding: 0; }
            .staticrypt-html, .staticrypt-body { height: 100%; }
            body.staticrypt-body {
                background: #ffffff;
                font-family: "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Yu Gothic", Meiryo, sans-serif;
                color: var(--text-primary);
                margin: 0;
                -webkit-font-smoothing: antialiased;
                -moz-osx-font-smoothing: grayscale;
            }

            .staticrypt-content {
                min-height: 100%;
                background: /*[|template_color_secondary|]*/ 0;
                display: flex; align-items: center; justify-content: center;
                padding: 40px 24px;
                position: relative;
            }

            /* 左上：ブランドマーク（テキストロゴ） */
            .brand-mark {
                position: fixed; top: 24px; left: 32px;
                display: flex; align-items: center;
                font-weight: 700; font-size: 15px;
                color: var(--brand-primary);
                letter-spacing: 0.02em;
            }
            .brand-mark::before {
                content: ""; display: inline-block;
                width: 10px; height: 10px; margin-right: 10px;
                background: var(--brand-primary);
            }

            /* カラーパレット装飾（左下・右上・右下の色ブロックでガイド感） */
            .color-decor {
                position: fixed; pointer-events: none;
                display: flex;
            }
            .color-decor.tl { top: 0; right: 0; }
            .color-decor.tl > div { width: 8px; height: 60px; }
            .color-decor.tl > div:nth-child(1) { background: var(--brand-primary); }
            .color-decor.tl > div:nth-child(2) { background: var(--brand-accent); }
            .color-decor.tl > div:nth-child(3) { background: var(--brand-yellow); }
            .color-decor.tl > div:nth-child(4) { background: var(--brand-primary-dark); }

            .color-decor.bl { bottom: 0; left: 0; }
            .color-decor.bl > div { width: 60px; height: 8px; }
            .color-decor.bl > div:nth-child(1) { background: var(--brand-primary); }
            .color-decor.bl > div:nth-child(2) { background: var(--brand-primary-pale); }
            .color-decor.bl > div:nth-child(3) { background: var(--bg-subtle); }

            /* カード */
            .staticrypt-page { width: 100%; max-width: 440px; }
            .staticrypt-form {
                background: #ffffff;
                border: 1px solid var(--border);
                padding: 56px 48px 48px;
                text-align: left;
            }

            .staticrypt-instructions { margin-bottom: 28px; }
            .en-label {
                font-family: "Inter", monospace; font-size: 11px;
                letter-spacing: 0.3em; color: var(--brand-accent);
                text-transform: uppercase; margin-bottom: 14px;
                display: block;
            }
            .staticrypt-title {
                font-size: 24px; font-weight: 900;
                color: var(--text-primary); line-height: 1.4;
                margin-bottom: 10px;
                letter-spacing: 0.02em;
            }
            .staticrypt-instructions p { font-size: 13px; color: var(--text-secondary); line-height: 1.8; }

            .staticrypt-hr {
                border: 0; border-top: 1px solid var(--border);
                margin: 24px 0;
            }

            .staticrypt-password-container {
                position: relative;
                border: 1px solid var(--border);
                background: var(--bg-subtle);
                margin-bottom: 16px;
            }
            .staticrypt-password-container:focus-within {
                border-color: var(--brand-primary);
                background: #ffffff;
            }
            .staticrypt-form input[type="password"],
            .staticrypt-form input[type="text"] {
                background: transparent;
                border: 0; outline: 0;
                font-family: inherit; font-size: 14px;
                padding: 14px 44px 14px 16px;
                width: 100%; color: var(--text-primary);
            }
            .staticrypt-toggle-password-visibility {
                cursor: pointer; position: absolute;
                right: 12px; top: 50%;
                transform: translateY(-50%);
                width: 18px; height: 18px; opacity: 0.55;
                padding: 4px;
            }

            label.staticrypt-remember {
                display: flex; align-items: center; gap: 8px;
                font-size: 12px; color: var(--text-secondary);
                margin-bottom: 20px; cursor: pointer;
            }
            .staticrypt-remember input[type="checkbox"] {
                accent-color: var(--brand-primary);
                width: 14px; height: 14px;
            }

            .staticrypt-form .staticrypt-decrypt-button {
                background: /*[|template_color_primary|]*/ 0;
                color: #ffffff;
                border: 0; outline: 0; cursor: pointer;
                width: 100%; padding: 16px;
                font-family: inherit; font-weight: 700; font-size: 14px;
                letter-spacing: 0.15em;
            }
            .staticrypt-form .staticrypt-decrypt-button:hover,
            .staticrypt-form .staticrypt-decrypt-button:active,
            .staticrypt-form .staticrypt-decrypt-button:focus {
                filter: brightness(0.92);
            }

            .foot-tag {
                text-align: center; margin-top: 24px;
                font-family: "Inter", monospace;
                font-size: 10px; letter-spacing: 0.25em;
                color: var(--text-muted); text-transform: uppercase;
            }

            .hidden { display: none !important; }

            .staticrypt-spinner-container {
                height: 100vh; display: flex; align-items: center; justify-content: center;
            }
            .staticrypt-spinner {
                display: inline-block; width: 2rem; height: 2rem;
                border: 0.22em solid var(--border);
                border-right-color: var(--brand-primary);
                border-radius: 50%;
                animation: spinner-border 0.75s linear infinite;
            }
            @keyframes spinner-border { 100% { transform: rotate(360deg); } }

            @media screen and (-webkit-min-device-pixel-ratio: 0) {
                .staticrypt-form input { font-size: 16px; }
            }
            @media (max-width: 520px) {
                .staticrypt-form { padding: 40px 28px; }
                .staticrypt-title { font-size: 20px; }
                .brand-mark { top: 16px; left: 20px; }
            }
        </style>
    </head>

    <body class="staticrypt-body">
        <div id="staticrypt_loading" class="staticrypt-spinner-container">
            <div class="staticrypt-spinner"></div>
        </div>

        <div id="staticrypt_content" class="staticrypt-content hidden">
            <div class="brand-mark">株式会社第二開発技工</div>

            <div class="color-decor tl">
                <div></div><div></div><div></div><div></div>
            </div>
            <div class="color-decor bl">
                <div></div><div></div><div></div>
            </div>

            <div class="staticrypt-page">
                <div class="staticrypt-form">
                    <div class="staticrypt-instructions">
                        <span class="en-label">— PROTECTED PREVIEW</span>
                        <p class="staticrypt-title">/*[|template_title|]*/0</p>
                        <p>/*[|template_instructions|]*/0</p>
                    </div>

                    <hr class="staticrypt-hr" />

                    <form id="staticrypt-form" action="#" method="post">
                        <div class="staticrypt-password-container">
                            <input
                                id="staticrypt-password"
                                type="password"
                                name="password"
                                placeholder="/*[|template_placeholder|]*/0"
                                autofocus
                            />

                            <img
                                class="staticrypt-toggle-password-visibility"
                                alt="/*[|template_toggle_show|]*/0"
                                title="/*[|template_toggle_show|]*/0"
                                src="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA2NDAgNTEyIj48cGF0aCBkPSJNMzguOCA1LjFDMjguNC0zLjEgMTMuMy0xLjIgNS4xIDkuMlMtMS4yIDM0LjcgOS4yIDQyLjlsNTkyIDQ2NGMxMC40IDguMiAyNS41IDYuMyAzMy43LTQuMXM2LjMtMjUuNS00LjEtMzMuN0w1MjUuNiAzODYuN2MzOS42LTQwLjYgNjYuNC04Ni4xIDc5LjktMTE4LjRjMy4zLTcuOSAzLjMtMTYuNyAwLTI0LjZjLTE0LjktMzUuNy00Ni4yLTg3LjctOTMtMTMxLjFDNDY1LjUgNjguOCA0MDAuOCAzMiAzMjAgMzJjLTY4LjIgMC0xMjUgMjYuMy0xNjkuMyA2MC44TDM4LjggNS4xek0yMjMuMSAxNDkuNUMyNDguNiAxMjYuMiAyODIuNyAxMTIgMzIwIDExMmM3OS41IDAgMTQ0IDY0LjUgMTQ0IDE0NGMwIDI0LjktNi4zIDQ4LjMtMTcuNCA2OC43TDQwOCAyOTQuNWM4LjQtMTkuMyAxMC42LTQxLjQgNC44LTYzLjNjLTExLjEtNDEuNS00Ny44LTY5LjQtODguNi03MS4xYy01LjgtLjItOS4yIDYuMS03LjQgMTEuN2MyLjEgNi40IDMuMyAxMy4yIDMuMyAyMC4zYzAgMTAuMi0yLjQgMTkuOC02LjYgMjguM2wtOTAuMy03MC44ek0zNzMgMzg5LjljLTE2LjQgNi41LTM0LjMgMTAuMS01MyAxMC4xYy03OS41IDAtMTQ0LTY0LjUtMTQ0LTE0NGMwLTYuOSAuNS0xMy42IDEuNC0yMC4yTDgzLjEgMTYxLjVDNjAuMyAxOTEuMiA0NCAyMjAuOCAzNC41IDI0My43Yy0zLjMgNy45LTMuMyAxNi43IDAgMjQuNmMxNC45IDM1LjcgNDYuMiA4Ny43IDkzIDEzMS4xQzE3NC41IDQ0My4yIDIzOS4yIDQ4MCAzMjAgNDgwYzQ3LjggMCA4OS45LTEyLjkgMTI2LjItMzIuNUwzNzMgMzg5Ljl6Ii8+PC9zdmc+"
                            />
                        </div>

                        <label id="staticrypt-remember-label" class="staticrypt-remember hidden">
                            <input id="staticrypt-remember" type="checkbox" name="remember" />
                            /*[|template_remember|]*/0
                        </label>

                        <input type="submit" class="staticrypt-decrypt-button" value="/*[|template_button|]*/0" />
                    </form>
                </div>

                <div class="foot-tag">DAINI KAIHATSU GIKO / RENEWAL WF</div>
            </div>
        </div>

        <script>
            const staticryptInitiator = /*[|js_staticrypt|]*/ 0;
            const templateError = "/*[|template_error|]*/0",
                templateToggleAltShow = "/*[|template_toggle_show|]*/0",
                templateToggleAltHide = "/*[|template_toggle_hide|]*/0",
                isRememberEnabled = /*[|is_remember_enabled|]*/ 0,
                staticryptConfig = /*[|staticrypt_config|]*/ 0;

            const templateConfig = {
                rememberExpirationKey: "staticrypt_expiration",
                rememberPassphraseKey: "staticrypt_passphrase",
                // HTML置換を1tick遅延させる → 呼出元の localStorage 保存が先に完走してから置換される
                replaceHtmlCallback: function (plainHTML) {
                    setTimeout(function () {
                        document.open();
                        document.write(plainHTML);
                        document.close();
                    }, 0);
                },
                clearLocalStorageCallback: null,
            };

            const staticrypt = staticryptInitiator.init(staticryptConfig, templateConfig);

            // Safety: 3.5秒経ってもフォームが出なければ localStorage をクリアしてリロード
            var _safetyTimer = setTimeout(function () {
                try {
                    localStorage.removeItem("staticrypt_expiration");
                    localStorage.removeItem("staticrypt_passphrase");
                } catch (e) {}
                document.getElementById("staticrypt_loading").classList.add("hidden");
                document.getElementById("staticrypt_content").classList.remove("hidden");
                var pw = document.getElementById("staticrypt-password");
                if (pw) pw.focus();
                if (isRememberEnabled) {
                    document.getElementById("staticrypt-remember-label").classList.remove("hidden");
                }
            }, 3500);

            // どのタイミングでも復号エラーが出たら保存パスワードをクリアしてフォームを出す
            function _showForm() {
                clearTimeout(_safetyTimer);
                var loading = document.getElementById("staticrypt_loading");
                var content = document.getElementById("staticrypt_content");
                if (loading) loading.classList.add("hidden");
                if (content) content.classList.remove("hidden");
                var pw = document.getElementById("staticrypt-password");
                if (pw) pw.focus();
                if (isRememberEnabled) {
                    var lbl = document.getElementById("staticrypt-remember-label");
                    if (lbl) lbl.classList.remove("hidden");
                }
            }
            function _clearStoredPw() {
                try {
                    localStorage.removeItem("staticrypt_expiration");
                    localStorage.removeItem("staticrypt_passphrase");
                } catch (e) {}
            }
            window.addEventListener('unhandledrejection', function () {
                _clearStoredPw(); _showForm();
            });

            window.onload = async function () {
                var isSuccessful = false;
                try {
                    var result = await staticrypt.handleDecryptOnLoad();
                    isSuccessful = result && result.isSuccessful;
                } catch (e) {
                    // 古い保存パスワードで復号失敗した場合
                    _clearStoredPw();
                    isSuccessful = false;
                }
                if (!isSuccessful) {
                    _showForm();
                } else {
                    clearTimeout(_safetyTimer);
                }
            };

            const toggleIcon = document.querySelector(".staticrypt-toggle-password-visibility");
            const imgSrcEyeClosed = toggleIcon.src;
            const imgSrcEyeOpened =
                "data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA1NzYgNTEyIj48cGF0aCBkPSJNMjg4IDMyYy04MC44IDAtMTQ1LjUgMzYuOC0xOTIuNiA4MC42QzQ4LjYgMTU2IDE3LjMgMjA4IDIuNSAyNDMuN2MtMy4zIDcuOS0zLjMgMTYuNyAwIDI0LjZDMTcuMyAzMDQgNDguNiAzNTYgOTUuNCAzOTkuNEMxNDIuNSA0NDMuMiAyMDcuMiA0ODAgMjg4IDQ4MHMxNDUuNS0zNi44IDE5Mi42LTgwLjZjNDYuOC00My41IDc4LjEtOTUuNCA5My0xMzEuMWMzLjMtNy45IDMuMy0xNi43IDAtMjQuNmMtMTQuOS0zNS43LTQ2LjItODcuNy05My0xMzEuMUM0MzMuNSA2OC44IDM2OC44IDMyIDI4OCAzMnpNMTQ0IDI1NmExNDQgMTQ0IDAgMSAxIDI4OCAwIDE0NCAxNDQgMCAxIDEgLTI4OCAwem0xNDQtNjRjMCAzNS4zLTI4LjcgNjQtNjQgNjRjLTcuMSAwLTEzLjktMS4yLTIwLjMtMy4zYy01LjUtMS44LTExLjkgMS42LTExLjcgNy40Yy4zIDYuOSAxLjMgMTMuOCAzLjIgMjAuN2MxMy43IDUxLjIgNjYuNCA4MS42IDExNy42IDY3LjlzODEuNi02Ni40IDY3LjktMTE3LjZjLTExLjEtNDEuNS00Ny44LTY5LjQtODguNi03MS4xYy01LjgtLjItOS4yIDYuMS03LjQgMTEuN2MyLjEgNi40IDMuMyAxMy4yIDMuMyAyMC4zeiIvPjwvc3ZnPg==";
            toggleIcon.addEventListener("click", function () {
                const passwordInput = document.getElementById("staticrypt-password");
                if (passwordInput.type === "password") {
                    passwordInput.type = "text";
                    toggleIcon.src = imgSrcEyeOpened;
                } else {
                    passwordInput.type = "password";
                    toggleIcon.src = imgSrcEyeClosed;
                }
            });

            document.getElementById("staticrypt-form").addEventListener("submit", async function (e) {
                e.preventDefault();
                const password = document.getElementById("staticrypt-password").value,
                    isRememberChecked = document.getElementById("staticrypt-remember").checked;
                const { isSuccessful } = await staticrypt.handleDecryptionOfPage(password, isRememberChecked);
                if (!isSuccessful) alert(templateError);
            });
        </script>
    </body>
</html>
